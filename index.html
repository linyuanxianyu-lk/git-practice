<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pjj打卡系统</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  .bar { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 8px; font-size: 15px; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: 8px 16px; font-size: 15px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: flex-start; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #eee; }
  li .txt { cursor: pointer; font-size: 16px; }
  li.done .txt { text-decoration: line-through; color: #999; }
  .ts { font-size: 12px; color: #888; margin-top: 2px; }
</style>
</head>
<body>
<h1>pjj打卡系统</h1>
<div class="bar">
  <input id="inp" type="text" placeholder="输入工作任务，回车或点添加">
  <button id="add">添加</button>
</div>
<ul id="list"></ul>
<script>
const KEY = 'luokang-checkin-tasks';
let tasks = JSON.parse(localStorage.getItem(KEY) || '[]');
const list = document.getElementById('list');
const inp = document.getElementById('inp');

function fmt(t) {
  const d = new Date(t);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function save() { localStorage.setItem(KEY, JSON.stringify(tasks)); }
function render() {
  list.innerHTML = '';
  tasks.forEach(t => {
    const li = document.createElement('li');
    if (t.doneAt) li.className = 'done';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = !!t.doneAt;
    box.addEventListener('change', () => {
      t.doneAt = box.checked ? Date.now() : null;
      save(); render();
    });
    const wrap = document.createElement('div');
    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = t.text;
    txt.addEventListener('click', () => {
      box.checked = !box.checked;
      box.dispatchEvent(new Event('change'));
    });
    const ts = document.createElement('div');
    ts.className = 'ts';
    ts.textContent = '创建 ' + fmt(t.createdAt) + (t.doneAt ? ' ｜ 完成 ' + fmt(t.doneAt) : '');
    wrap.append(txt, ts);
    li.append(box, wrap);
    list.append(li);
  });
}
function add() {
  const text = inp.value.trim();
  if (!text) return;
  tasks.push({ text: text, createdAt: Date.now(), doneAt: null });
  inp.value = '';
  save(); render();
}
document.getElementById('add').addEventListener('click', add);
inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
render();
</script>
</body>
</html>
